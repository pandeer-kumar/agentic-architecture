<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"><defs><marker id="ah-0284C7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284C7"/></marker><marker id="ah-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-4F46E5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah-64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="ah-C026D3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker><marker id="ah-D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ah-DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="40" font-size="22" font-weight="800" fill="#0F172A">Scratchpad: lifecycle and rules</text><text x="28" y="62" font-size="13" fill="#475569">A typed, bounded, job-scoped notebook. It bridges epoch resets without becoming a second memory.</text><rect x="40" y="250" width="700" height="470" rx="14" fill="#FDF4FF" fill-opacity="0.55" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.5"/><text x="54" y="272" font-size="13" font-weight="700" fill="#C026D3" letter-spacing="0.6">ENTRY TYPES</text><rect x="770" y="250" width="690" height="470" rx="14" fill="#FEF2F2" fill-opacity="0.55" stroke="#DC2626" stroke-opacity="0.55" stroke-width="1.5"/><text x="784" y="272" font-size="13" font-weight="700" fill="#DC2626" letter-spacing="0.6">RULES ENFORCED BY THE HARNESS</text><rect x="40" y="120" width="220" height="80" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="150.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Job starts</text><text x="150.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">empty scratchpad</text><text x="150.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">(per job, per sub-agent)</text><rect x="320" y="120" width="260" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="450.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#4A044E">scratchpad_write</text><text x="450.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">type · text ≤ 300 chars</text><text x="450.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">refs (required for findings)</text><path d="M640,129 a120.0,9 0 0,0 240,0 v62 a120.0,9 0 0,1 -240,0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="760.0" cy="129" rx="120.0" ry="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="760.0" y="155.5" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">scratchpad_entries</text><text x="760.0" y="171.5" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">append-only rows</text><text x="760.0" y="186.5" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">supersede, never edit</text><rect x="940" y="120" width="240" height="80" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="1060.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">Injected as L6</text><text x="1060.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">every epoch</text><text x="1060.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">newest first, ≤ 3k tokens</text><rect x="1240" y="120" width="220" height="80" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="1350.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Job ends</text><text x="1350.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">archived with job</text><text x="1350.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">read-only</text><rect x="60" y="290" width="420" height="58" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="270.0" y="316.0" text-anchor="middle" font-size="13" font-weight="700" fill="#052E16">finding</text><text x="270.0" y="331.0" text-anchor="middle" font-size="11.5" fill="#052E16" fill-opacity="0.82">verified fact with refs (record / fact ids)</text><rect x="60" y="360" width="420" height="58" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="270.0" y="386.0" text-anchor="middle" font-size="13" font-weight="700" fill="#431407">hypothesis</text><text x="270.0" y="401.0" text-anchor="middle" font-size="11.5" fill="#431407" fill-opacity="0.82">unverified idea to test</text><rect x="60" y="430" width="420" height="58" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="270.0" y="456.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">open_question</text><text x="270.0" y="471.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">something to ask the user or check</text><rect x="60" y="500" width="420" height="58" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="270.0" y="526.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">decision</text><text x="270.0" y="541.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">choice made + reason (e.g. which field = CAB)</text><rect x="60" y="570" width="420" height="58" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="270.0" y="596.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">todo</text><text x="270.0" y="611.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">follow-up the ledger does not cover</text><rect x="60" y="640" width="420" height="58" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="270.0" y="666.0" text-anchor="middle" font-size="13" font-weight="700" fill="#450A0A">warning</text><text x="270.0" y="681.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">data caveat: partial source, permission gap</text><path d="M1180.0,160.0 L1240.0,160.0" fill="none" stroke="#C026D3" stroke-width="1.6" marker-end="url(#ah-C026D3)"/><path d="M880.0,160.0 L940.0,160.0" fill="none" stroke="#C026D3" stroke-width="1.6" marker-end="url(#ah-C026D3)"/><path d="M580.0,160.0 L640.0,160.0" fill="none" stroke="#C026D3" stroke-width="1.6" marker-end="url(#ah-C026D3)"/><path d="M260.0,160.0 L320.0,160.0" fill="none" stroke="#C026D3" stroke-width="1.6" marker-end="url(#ah-C026D3)"/><text x="500" y="324" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">may be cited</text><text x="500" y="394" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">never in answers</text><text x="500" y="464" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">drives next step</text><text x="500" y="534" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">audit trail</text><text x="500" y="604" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">short-lived</text><text x="500" y="674" text-anchor="start" font-size="12.5" font-weight="700" fill="#334155">must reach answer</text><text x="795" y="300" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">1.</text><text x="820" y="300" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Bounded: ≤ 40 active entries / 3k tokens; overflow → compressor merges oldest</text><text x="795" y="358" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">2.</text><text x="820" y="358" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Findings must cite refs that exist in this job (validated on write)</text><text x="795" y="416" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">3.</text><text x="820" y="416" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Hypotheses can never be used as claims; the verifier rejects them</text><text x="795" y="474" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">4.</text><text x="820" y="474" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Warnings are copied into the answer&#x27;s caveats automatically</text><text x="795" y="532" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">5.</text><text x="820" y="532" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Sub-agents get their own scratchpad; only their summary returns</text><text x="795" y="590" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">6.</text><text x="820" y="590" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Never auto-promoted: promotion goes through the memory gate</text><text x="795" y="648" text-anchor="start" font-size="14" font-weight="800" fill="#DC2626">7.</text><text x="820" y="648" text-anchor="start" font-size="13" font-weight="500" fill="#0F172A">Untrusted text may not be copied in verbatim (quotes ≤ 120 chars, fenced)</text></svg>