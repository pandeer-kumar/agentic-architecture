<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="940" viewBox="0 0 1640 940" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"><defs><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="40" font-size="22" font-weight="800" fill="#0F172A">Context engine: epochs and payload layers</text><text x="28" y="62" font-size="13" fill="#475569">A job runs as one or more epochs (model conversations). Each epoch&#x27;s payload is assembled from budgeted layers.</text><rect x="25" y="90" width="720" height="810" rx="14" fill="#F5F3FF" fill-opacity="0.55" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.5"/><text x="39" y="112" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="0.6">ONE JOB, SEVERAL EPOCHS</text><rect x="775" y="90" width="840" height="810" rx="14" fill="#F5F3FF" fill-opacity="0.55" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.5"/><text x="789" y="112" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="0.6">PAYLOAD OF EVERY MODEL CALL (ORCHESTRATOR, ≤ 120K TOKENS)</text><rect x="55" y="140" width="300" height="220" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="205.0" y="218.5" text-anchor="middle" font-size="16" font-weight="700" fill="#2E1065">Epoch 1</text><text x="205.0" y="236.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">append-only conversation</text><text x="205.0" y="251.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">tool set fixed for the epoch</text><text x="205.0" y="266.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82"></text><text x="205.0" y="281.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">turns: plan → fetch → map</text><text x="205.0" y="296.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">context grows ↑</text><rect x="415" y="140" width="300" height="220" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="565.0" y="218.5" text-anchor="middle" font-size="16" font-weight="700" fill="#2E1065">Epoch 2</text><text x="565.0" y="236.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">fresh conversation</text><text x="565.0" y="251.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">L0–L7 rebuilt from stores</text><text x="565.0" y="266.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">+ structured handoff</text><text x="565.0" y="281.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82"></text><text x="565.0" y="296.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">turns: reduce → draft</text><rect x="55" y="420" width="320" height="62" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="215.0" y="448.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Budget</text><text x="215.0" y="463.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">working set &gt; 55k tokens</text><rect x="395" y="420" width="320" height="62" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="555.0" y="448.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Tool set change</text><text x="555.0" y="463.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">model asked request_tools()</text><rect x="55" y="498" width="320" height="62" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="215.0" y="526.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Phase boundary</text><text x="215.0" y="541.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">ledger step kind changes</text><rect x="395" y="498" width="320" height="62" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="555.0" y="526.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Turn cap</text><text x="555.0" y="541.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">&gt; 40 model turns</text><rect x="55" y="576" width="320" height="62" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="215.0" y="604.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Profile/playbook update</text><text x="215.0" y="619.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">new version approved</text><rect x="395" y="576" width="320" height="62" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="555.0" y="604.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Model switch</text><text x="555.0" y="619.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">fallback / routing change</text><rect x="55" y="666" width="660" height="84" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="385.0" y="698.0" text-anchor="middle" font-size="14" font-weight="700" fill="#4A044E">Structured handoff (custom compressor, JSON)</text><text x="385.0" y="714.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">goal · window · acceptance contract · ledger · facts · handles</text><text x="385.0" y="729.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">scratchpad (verbatim) · open questions · last user turn</text><rect x="800" y="130" width="560" height="52" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="1080.0" y="153.0" text-anchor="middle" font-size="13" font-weight="700" fill="#451A03">L0  Tool definitions</text><text x="1080.0" y="168.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">router-selected subset</text><rect x="800" y="190" width="560" height="52" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="1080.0" y="213.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">L1  System core</text><text x="1080.0" y="228.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">role · grounding &amp; approval rules</text><rect x="800" y="250" width="560" height="52" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1080.0" y="273.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">L2  Org profile</text><text x="1080.0" y="288.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">approved semantic memory (pinned)</text><rect x="800" y="310" width="560" height="52" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1080.0" y="333.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">L3  Playbook</text><text x="1080.0" y="348.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">one selected procedure</text><rect x="800" y="370" width="560" height="52" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1080.0" y="393.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">L4  Session state</text><text x="1080.0" y="408.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">conversation summary · referents</text><rect x="800" y="430" width="560" height="52" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="1080.0" y="453.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">L5  Task ledger</text><text x="1080.0" y="468.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">plan · steps · handles · facts</text><rect x="800" y="490" width="560" height="52" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1080.0" y="513.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">L6  Scratchpad</text><text x="1080.0" y="528.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">findings · hypotheses · open questions</text><rect x="800" y="550" width="560" height="52" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1080.0" y="573.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">L7  Retrieved memory</text><text x="1080.0" y="588.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">top-k long-term items with provenance</text><rect x="800" y="610" width="560" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="1080.0" y="667.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2E1065">L8  Working turns</text><text x="1080.0" y="682.0" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">this epoch&#x27;s turns, handles, samples</text><rect x="800" y="738" width="560" height="52" rx="9" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/><text x="1080.0" y="761.0" text-anchor="middle" font-size="13" font-weight="700" fill="#082F49">L9  Current user turn</text><text x="1080.0" y="776.0" text-anchor="middle" font-size="11.5" fill="#082F49" fill-opacity="0.82">latest message / handoff</text><rect x="800" y="798" width="560" height="52" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="1080.0" y="821.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">R   Output reserve</text><text x="1080.0" y="836.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">thinking + answer headroom</text><path d="M1530.0,136.0 L1530.0,384.0" fill="none" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ah-7C3AED)"/><path d="M355.0,250.0 L415.0,250.0" fill="none" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#ah-7C3AED)"/><rect x="364.25" y="232.0" width="41.5" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="385.0" y="245.0" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="600">reset</text><text x="385" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#2E1065">An epoch ends when any trigger fires:</text><text x="385" y="790" text-anchor="middle" font-size="12" font-weight="500" fill="#475569" font-style="italic">Why epochs: current models reject edited history (thinking-block check),</text><text x="385" y="808" text-anchor="middle" font-size="12" font-weight="500" fill="#475569" font-style="italic">so we never trim a live conversation. We start a new one from durable state.</text><text x="1380" y="160.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 8k</text><text x="1450" y="160.0" text-anchor="start" font-size="12" font-weight="600" fill="#7C3AED">cached</text><text x="1380" y="220.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 4k</text><text x="1450" y="220.0" text-anchor="start" font-size="12" font-weight="600" fill="#7C3AED">cached</text><text x="1380" y="280.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 3k</text><text x="1450" y="280.0" text-anchor="start" font-size="12" font-weight="600" fill="#7C3AED">cached</text><text x="1380" y="340.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 6k</text><text x="1450" y="340.0" text-anchor="start" font-size="12" font-weight="600" fill="#7C3AED">cached</text><text x="1380" y="400.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 3k</text><text x="1450" y="400.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">per epoch</text><text x="1380" y="460.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 3k</text><text x="1450" y="460.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">per epoch</text><text x="1380" y="520.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 3k</text><text x="1450" y="520.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">per epoch</text><text x="1380" y="580.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 3k</text><text x="1450" y="580.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">per epoch</text><text x="1380" y="674.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 55k</text><text x="1450" y="674.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">grows</text><text x="1380" y="768.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≤ 2k</text><text x="1450" y="768.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">volatile</text><text x="1380" y="828.0" text-anchor="start" font-size="13" font-weight="800" fill="#0F172A">≥ 30k</text><text x="1450" y="828.0" text-anchor="start" font-size="12" font-weight="600" fill="#64748B">—</text><text x="1540" y="264" text-anchor="start" font-size="11" font-weight="700" fill="#7C3AED">stable</text><text x="1540" y="278" text-anchor="start" font-size="11" font-weight="700" fill="#7C3AED">prefix</text><text x="1195" y="885" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" font-style="italic">Order = most stable first → prompt-cache hits; volatile content last</text></svg>