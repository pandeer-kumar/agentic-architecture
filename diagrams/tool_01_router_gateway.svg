<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"><defs><marker id="ah-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="40" font-size="22" font-weight="800" fill="#0F172A">Tool routing and the tool-gateway call path</text><text x="28" y="62" font-size="13" fill="#475569">Custom tool router picks the tools for an epoch; every call passes the same gateway chain, whatever the server</text><rect x="25" y="90" width="520" height="760" rx="14" fill="#FFFBEB" fill-opacity="0.55" stroke="#D97706" stroke-opacity="0.55" stroke-width="1.5"/><text x="39" y="112" font-size="13" font-weight="700" fill="#D97706" letter-spacing="0.6">TOOL ROUTER (PER EPOCH)</text><rect x="575" y="90" width="1100" height="760" rx="14" fill="#FFFBEB" fill-opacity="0.55" stroke="#D97706" stroke-opacity="0.55" stroke-width="1.5"/><text x="589" y="112" font-size="13" font-weight="700" fill="#D97706" letter-spacing="0.6">TOOL GATEWAY CHAIN (EVERY CALL)</text><rect x="55" y="140" width="460" height="90" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="285.0" y="183.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">Tool catalog</text><text x="285.0" y="200.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">mcp_tools: enabled, approved hash</text><rect x="55" y="260" width="460" height="90" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="285.0" y="303.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">Role filter</text><text x="285.0" y="320.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">allowed_roles × agent role</text><rect x="55" y="380" width="460" height="90" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="285.0" y="423.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">Relevance ranking</text><text x="285.0" y="440.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">BM25 + embedding vs goal / playbook</text><rect x="55" y="500" width="460" height="90" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="285.0" y="535.5" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">Budget fit</text><text x="285.0" y="552.5" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">≤ 8k tokens of definitions</text><text x="285.0" y="567.5" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">core tools always included</text><rect x="55" y="620" width="460" height="90" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="285.0" y="663.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">Epoch tool set (frozen)</text><text x="285.0" y="680.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">+ request_tools(capability) meta-tool</text><rect x="605" y="140" width="470" height="84" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="840.0" y="180.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">1 Schema validate</text><text x="840.0" y="197.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">JSON Schema · actionable error</text><rect x="605" y="252" width="470" height="84" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="840.0" y="292.0" text-anchor="middle" font-size="15" font-weight="700" fill="#450A0A">2 Policy + RBAC</text><text x="840.0" y="309.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">tool × agent role × user role</text><rect x="605" y="364" width="470" height="84" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="840.0" y="404.0" text-anchor="middle" font-size="15" font-weight="700" fill="#450A0A">3 Write?</text><text x="840.0" y="421.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">→ create action, return pending_approval</text><rect x="605" y="476" width="470" height="84" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="840.0" y="516.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">4 Rate limit</text><text x="840.0" y="533.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">per source token bucket · fairness</text><rect x="605" y="588" width="470" height="84" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="840.0" y="628.0" text-anchor="middle" font-size="15" font-weight="700" fill="#450A0A">5 Credentials</text><text x="840.0" y="645.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">user-delegated token from Vault</text><rect x="605" y="700" width="470" height="84" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="840.0" y="740.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">6 Custom MCP server</text><text x="840.0" y="757.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">calls vendor REST API</text><rect x="1150" y="588" width="490" height="84" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1395.0" y="628.0" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">7 Size check</text><text x="1395.0" y="645.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">rows &gt; 20 or &gt; 4k tokens → offload</text><rect x="1150" y="476" width="490" height="84" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="1395.0" y="516.0" text-anchor="middle" font-size="15" font-weight="700" fill="#450A0A">8 Sanitise + scan</text><text x="1395.0" y="533.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">strip controls · injection flag</text><rect x="1150" y="364" width="490" height="84" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="1395.0" y="404.0" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">9 Fence + shape</text><text x="1395.0" y="421.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">handle summary or fenced result</text><rect x="1150" y="252" width="490" height="84" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/><text x="1395.0" y="292.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">10 Audit + telemetry</text><text x="1395.0" y="309.0" text-anchor="middle" font-size="11.5" fill="#0F172A" fill-opacity="0.82">tool_calls · trace span</text><path d="M1150,709 a245.0,9 0 0,0 490,0 v52 a245.0,9 0 0,1 -490,0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="1395.0" cy="709" rx="245.0" ry="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1395.0" y="738.0" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">Record store</text><text x="1395.0" y="754.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">full result kept here</text><path d="M1395.0,252.0 L1395.0,150.0" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-059669)"/><path d="M1395.0,672.0 L1395.0,700.0" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-059669)"/><path d="M1075.0,742.0 L1112.5,742.0 L1112.5,630.0 L1150.0,630.0" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-059669)"/><path d="M1395.0,364.0 L1395.0,336.0" fill="none" stroke="#059669" stroke-w