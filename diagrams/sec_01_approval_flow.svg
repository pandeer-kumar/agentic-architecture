t><text x="592.5" y="207.5" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">idempotency key · user turn</text><rect x="720" y="130" width="205" height="110" rx="9" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/><text x="822.5" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#082F49">Approval card</text><text x="822.5" y="192.5" text-anchor="middle" font-size="11.5" fill="#082F49" fill-opacity="0.82">console + Teams</text><text x="822.5" y="207.5" text-anchor="middle" font-size="11.5" fill="#082F49" fill-opacity="0.82">per-item exclude</text><rect x="950" y="130" width="205" height="110" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="1052.5" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#450A0A">Decision</text><text x="1052.5" y="192.5" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">DB triggers enforce</text><text x="1052.5" y="207.5" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">role · SoD · count · expiry</text><rect x="1180" y="130" width="205" height="110" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/><text x="1282.5" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#451A03">Executor</text><text x="1282.5" y="192.5" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">precondition re-check</text><text x="1282.5" y="207.5" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">execute once</text><rect x="1410" y="130" width="205" height="110" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="1512.5" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#052E16">Post-condition</text><text x="1512.5" y="192.5" text-anchor="middle" font-size="11.5" fill="#052E16" fill-opacity="0.82">re-read target</text><text x="1512.5" y="207.5" text-anchor="middle" font-size="11.5" fill="#052E16" fill-opacity="0.82">audit chain</t