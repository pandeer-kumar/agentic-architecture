="1.6" marker-end="url(#ah-DC2626)"/><path d="M695.0,185.0 L720.0,185.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><path d="M465.0,185.0 L490.0,185.0" fill="none" stroke="#DC2626" stroke-width="1.6" marker-end="url(#ah-DC2626)"/><path d="M235.0,185.0 L260.0,185.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><text x="820" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#450A0A">Reject → action rejected · arguments immutable after proposal · expired actions cannot be approved</text><text x="820" y="520" text-anchor="middle" font-size="13" font-weight="500" fill="#475569" font-style="italic">Concurrent approvers are serialised by a row lock (tested: exactly one decision recorded)</text><text x="820" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Injected instructions in ticket text can at most create a proposal that a human sees</text></svg>