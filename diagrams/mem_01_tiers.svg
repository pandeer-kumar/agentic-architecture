<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="900" viewBox="0 0 1640 900" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"><defs><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="ah-C026D3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="40" font-size="22" font-weight="800" fill="#0F172A">Memory: short-term, scratchpad, long-term</text><text x="28" y="62" font-size="13" fill="#475569">Short-term memory lives for a session or job; long-term memory is curated, versioned and reviewed</text><rect x="25" y="90" width="760" height="700" rx="14" fill="#FDF4FF" fill-opacity="0.55" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.5"/><text x="39" y="112" font-size="13" font-weight="700" fill="#C026D3" letter-spacing="0.6">SHORT-TERM MEMORY (SESSION / JOB SCOPE)</text><rect x="855" y="90" width="760" height="700" rx="14" fill="#FDF4FF" fill-opacity="0.55" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.5"/><text x="869" y="112" font-size="13" font-weight="700" fill="#C026D3" letter-spacing="0.6">LONG-TERM MEMORY (ORG / USER SCOPE)</text><rect x="50" y="135" width="560" height="85" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="330.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#2E1065">Working context</text><text x="330.0" y="192.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">the live epoch payload (L0–L9)</text><rect x="50" y="240" width="560" height="85" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="330.0" y="280.5" text-anchor="middle" font-size="15" font-weight="700" fill="#4A044E">Session state</text><text x="330.0" y="297.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">rolling conversation summary · user tz · active goal</text><rect x="50" y="345" width="560" height="85" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="330.0" y="385.5" text-anchor="middle" font-size="15" font-weight="700" fill="#4A044E">Referents</text><text x="330.0" y="402.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">“those tickets”, “the second one” → handles / ids</text><rect x="50" y="450" width="560" height="85" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="330.0" y="490.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Task ledger</text><text x="330.0" y="507.5" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">plan, steps, status, handles, facts (harness-owned)</text><rect x="50" y="555" width="560" height="85" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="330.0" y="595.5" text-anchor="middle" font-size="15" font-weight="700" fill="#4A044E">Scratchpad</text><text x="330.0" y="612.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">typed notes the agent writes while working</text><rect x="50" y="660" width="560" height="85" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="330.0" y="700.5" text-anchor="middle" font-size="15" font-weight="700" fill="#064E3B">Result sets</text><text x="330.0" y="717.5" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">fetched records + labels (data plane, 30 days)</text><rect x="880" y="135" width="520" height="100" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1140.0" y="183.5" text-anchor="middle" font-size="16" font-weight="700" fill="#4A044E">Semantic</text><text x="1140.0" y="201.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">org facts: project keys, CI taxonomy, team map</text><rect x="880" y="260" width="520" height="100" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1140.0" y="308.5" text-anchor="middle" font-size="16" font-weight="700" fill="#4A044E">Episodic</text><text x="1140.0" y="326.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">summaries of past verified jobs and findings</text><rect x="880" y="385" width="520" height="100" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1140.0" y="433.5" text-anchor="middle" font-size="16" font-weight="700" fill="#4A044E">Procedural</text><text x="1140.0" y="451.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">playbooks + rubrics (versioned procedures)</text><rect x="880" y="510" width="520" height="100" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1140.0" y="558.5" text-anchor="middle" font-size="16" font-weight="700" fill="#4A044E">Preferences</text><text x="1140.0" y="576.5" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">per-user output and grouping preferences</text><rect x="880" y="650" width="710" height="110" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="1235.0" y="695.5" text-anchor="middle" font-size="15" font-weight="700" fill="#450A0A">Promotion gate</text><text x="1235.0" y="712.5" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">provenance required · sensitivity check · dedupe / conflict detection</text><text x="1235.0" y="727.5" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">no memory from untrusted ticket text alone · versioned, never overwritten</text><path d="M880.0,185.0 L840.0,185.0 L840.0,158.0 L610.0,158.0" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-7C3AED)"/><path d="M1235.0,650.0 L1235.0,610.0" fill="none" stroke="#C026D3" stroke-width="1.6" marker-end="url(#ah-C026D3)"/><path d="M610.0,572.0 L830.0,572.0 L830.0,705.0 L880.0,705.0" fill="none" stroke="#C026D3" stroke-width="1.6" marker-end="url(#ah-C026D3)"/><rect x="630" y="169" width="73.8" height="19" rx="9.5" fill="#7C3AED"/><text x="666.9" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">one epoch</text><rect x="630" y="274" width="59.4" height="19" rx="9.5" fill="#C026D3"/><text x="659.7" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">session</text><rect x="630" y="379" width="59.4" height="19" rx="9.5" fill="#C026D3"/><text x="659.7" y="393" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">session</text><rect x="630" y="484" width="30.6" height="19" rx="9.5" fill="#C026D3"/><text x="645.3" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">job</text><rect x="630" y="589" width="30.6" height="19" rx="9.5" fill="#C026D3"/><text x="645.3" y="603" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">job</text><rect x="630" y="694" width="30.6" height="19" rx="9.5" fill="#C026D3"/><text x="645.3" y="708" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">job</text><rect x="1420" y="177" width="95.4" height="19" rx="9.5" fill="#DC2626"/><text x="1467.7" y="191" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">human review</text><rect x="1420" y="302" width="95.4" height="19" rx="9.5" fill="#C026D3"/><text x="1467.7" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">auto, decays</text><rect x="1420" y="427" width="66.6" height="19" rx="9.5" fill="#DC2626"/><text x="1453.3" y="441" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">approver</text><rect x="1420" y="552" width="102.60000000000001" height="19" rx="9.5" fill="#C026D3"/><text x="1471.3" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">user confirms</text><rect x="658.3" y="554.0" width="123.39999999999999" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="720.0" y="567.0" text-anchor="middle" font-size="11" fill="#C026D3" font-weight="600">promote (proposal)</text><rect x="653.85" y="140.0" width="142.29999999999998" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="725.0" y="153.0" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="600">retrieve into L2 / L7</text><text x="820" y="830" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Scratchpad ≠ memory: it is discarded (archived) at job end. Only reviewed, provenance-backed items reach long-term memory.</text><text x="820" y="856" text-anchor="middle" font-size="12" font-weight="500" fill="#475569" font-style="italic">Scratchpad entries survive epoch resets (they are re-injected as L6), which is why the agent needs one.</text></svg>