l="#451A03" fill-opacity="0.82">connector-owned paging</text><text x="510.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#451A03" fill-opacity="0.82">checkpoint per page</text><rect x="700" y="120" width="280" height="100" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="840.0" y="161.0" text-anchor="middle" font-size="16" font-weight="700" fill="#450A0A">Completeness</text><text x="840.0" y="179.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">exhaustion · count match</text><text x="840.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">bound check</text><rect x="1030" y="120" width="280" height="100" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1170.0" y="161.0" text-anchor="middle" font-size="16" font-weight="700" fill="#064E3B">Normalise</text><text x="1170.0" y="179.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">canonical records</text><text x="1170.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">content hash</text><rect x="1360" y="120" width="280" height="100" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1500.0" y="161.0" text-anchor="middle" font-size="16" font-weight="700" fill="#064E3B">Pre-filter</text><text x="1500.0" y="179.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">structured criteria in SQL</text><text x="1500.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">in / out / judge</text><rect x="40" y="330" width="280" height="100" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="180.0" y="371.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Map (batches of 25)</text><text x="180.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">structured output</text><text x="180.0" y="404.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">short local ids</text><rect x="370" y="330" width="280" height="100" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="510.0" y="371.0" text-anchor="middle" font-size="16" font-weight="700" fill="#450A0A">Validators V1–V5</text><text x="510.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">coverage · grounding</text><text x="510.0" y="404.0" text-anchor="middle" font-size="11.5" fill="#450A0A" fill-opacity="0.82">stop reason · retry cap</text><rect x="700" y="330" width="280" height="100" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="840.0" y="371.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Recall net + 2nd opinion</text><text x="840.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">negatives with signals</text><text x="840.0" y="404.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">low/medium + 5% sample</text><rect x="1030" y="330" width="280" height="100" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="1170.0" y="371.0" text-anchor="middle" font-size="16" font-weight="700" fill="#064E3B">Reduce → facts</text><text x="1170.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">Analyzer SQL</text><text x="1170.0" y="404.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">immutable, reproducible</text><rect x="1360" y="330" width="280" height="100" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="1500.0" y="371.0" text-anchor="middle" font-size="16" font-weight="700" fill="#052E16">Render + verify</text><text x="1500.0" y="389.0" text-anchor="middle" font-size="11.5" fill="#052E16" fill-opacity="0.82">lists from DB</text><text x="1500.0" y="404.0" text-anchor="middle" font-size="11.5" fill="#052E16" fill-opacity="0.82">triple check</text><rect x="60" y="570" width="300" he