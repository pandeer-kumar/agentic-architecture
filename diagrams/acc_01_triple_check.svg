7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ah-EA580C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="40" font-size="22" font-weight="800" fill="#0F172A">Accuracy: the triple check</text><text x="28" y="62" font-size="13" fill="#475569">Three independent mechanisms; the database refuses to mark an answer verified unless all pass</text><rect x="320" y="100" width="370" height="440" rx="14" fill="#ECFDF5" fill-opacity="0.55" stroke="#059669" stroke-opacity="0.55" stroke-width="1.5"/><text x="334" y="122" font-size="13" font-weight="700" fill="#059669" letter-spacing="0.6">CHECK 1 · DETERMINISTIC (CODE)</text><rect x="720" y="100" width="370" height="440" rx="14" fill="#EEF2FF" fill-opacity="0.55" stroke="#4F46E5" stroke-opacity="0.55" stroke-width="1.5"/><text x="734" y="122" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="0.6">CHECK 2 · INDEPENDENT VERIFIER (MODEL)</text><rect x="1120" y="100" width="370" height="440" rx="14" fill="#F0FDF4" fill-opacity="0.55" stroke="#16A34A" stroke-opacity="0.55" stroke-width="1.5"/><text x="1134" y="122" font-size="13" font-weight="700" fill="#16A34A" letter-spacing="0.6">CHECK 3 · RECONCILIATION &amp; SAMPLING</text><rect x="40" y="300" width="220" height="110" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="150.0" y="346.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">Draft answer</text><text x="150.0" y="364.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">narrative with</text><text x="150.0" y="379.0" text-anchor="middle" font-size="11.5" fill="#1E1B4B" fill-opacity="0.82">placeholders + claims</text><rect x="340" y="145" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="505.0" y="174.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">D1 schema valid</text><rect x="340" y="207" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="505.0" y="236.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">D2 every claim has refs</text><rect x="340" y="269" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="505.0" y="298.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">D3 numbers == fact values</text><rect x="340" y="331" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="505.0" y="360.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">D4 ids exist in result sets</text><rect x="340" y="393" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="505.0" y="422.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">D5 facts re-run identically</text><rect x="340" y="455" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="505.0" y="484.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">D6–D8 caveats, window, coverage</text><rect x="740" y="145" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="905.0" y="174.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">sees claims, facts, evidence only</text><rect x="740" y="207" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="905.0" y="236.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">A1 entailment per claim</text><rect x="740" y="269" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="905.0" y="298.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">A2 scope (question + window)</text><rect x="740" y="331" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="905.0" y="360.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">A3 absence needs typed null</text><rect x="740" y="393" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="905.0" y="422.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">A4 causal claims need links</text><rect x="740" y="455" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="905.0" y="484.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">A5 recommendations marked</text><rect x="1140" y="145" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="1305.0" y="174.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">R1 cross-source reconciliation</text><rect x="1140" y="207" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="1305.0" y="236.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">R2 2nd-opinion disagreement rate</text><rect x="1140" y="269" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="1305.0" y="298.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">R3 daily human audit sample</text><rect x="1140" y="331" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="1305.0" y="360.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">R4 online LLM judge (10 %)</text><rect x="1140" y="393" width="330" height="50" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="1305.0" y="422.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F172A">R5 user feedback → eval cases</text><rect x="1150" y="580" width="410" height="110" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/><text x="1355.0" y="633.0" text-anchor="middle" font-size="15" font-weight="700" fill="#052E16">Answer + confidence banner</text><text x="1355.0" y="650.0" text-anchor="middle" font-size="11.5" fill="#052E16" fill-opacity="0.82">Verified · Verified with caveats · Partially verified</text><rect x="320" y="580" width="500" height="110" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="570.0" y="625.5" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Revision (max 2)</text><text x="570.0" y="642.5" text-anchor="middle" font-size="11.5" fill="#431407" fill-opacity="0.82">specific feedback, e.g. “claim c2 says 15; F-2 = 14”</text><text x="570.0" y="657.5" text-anchor="middle" font-size="11.5" fill="#431407" fill-opacity="0.82">after 2 failures → downgraded answer, flagged</text><path d="M320.0,635.0 L150.0,635.0 L150.0,410.0" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#ah-EA580C)"/><path d="M1305.0,540.0 L1305.0,580.0" fill="none" stroke="#16A34A" stroke-width="1.6" marker-end="url(#ah-16A34A)"/><path d="M905.0,540.0 L905.0,635.0 L820.0,635.0" fill="none" stroke="#DC2626" stroke-width="1.6" marker-end="url(#ah-DC2626)"/><path d="M505.0,540.0 L505.0,580.0" fill="none" stroke="#DC2626" stroke-width="1.6" marker-end="url(#ah-DC2626)"/><path d="M1090.0,320.0 L1120.0,320.0" fill="none" stroke="#16A34A" stroke-width="1.6" marker-end="url(#ah-16A34A)"/><path d="M690.0,320.0 L720.0,320.0" fill="none" stroke="#16A34A" stroke-width="1.6" marker-end="url(#ah-16A34A)"/><path d="M260.0,355.0 L290.0,355.0 L290.0,170.0 L340.0,170.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah-334155)"/><rect x="687.4" y="302.0" width="35.2" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="705.0" y="315.0" text-anchor="middle" font-size="11" fill="#16A34A" font-weight="600">pass</text><rect x="1087.4" y="302.0" width="35.2" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="1105.0" y="315.0" text-anchor="middle" font-s