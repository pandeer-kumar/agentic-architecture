e="11.5" font-weight="600" fill="#334155">question (+ user tz)</text><text x="366.0" y="219" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">build payload (epoch 1)</text><text x="534.0" y="257" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">request: system · profile · ledger · tools</text><text x="450.0" y="295" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">plan_query_spec → absolute UTC window</text><rect x="20" y="325" width="1532" height="24" rx="5" fill="#F1F5F9"/><text x="32" y="342" text-anchor="start" font-size="12" font-weight="800" fill="#334155">2  FETCH  (data never enters context)</text><text x="534.0" y="371" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">jira_…_to_resultset / servicenow_…</text><text x="870.0" y="409" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">paginate → 612 + 388 records</text><text x="534.0" y="447" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">handles + completeness proof + sample</text><rect x="20" y="477" width="1532" height="24" rx="5" fill="#F1F5F9"/><text x="32" y="494" text-anchor="start" font-size="12" font-weight="800" fill="#334155">3  MAP  (isolated sub-agents, batches of 25)</text><text x="702.0" y="523" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">analyzer_classify(handle, rubric)</text><text x="1038.0" y="561" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">labels · coverage 100% · grounded</text><rect x="894.0" y="590" width="288.0" height="26" rx="6" fill="#F5F3FF" stroke="#7C3AED"/><text x="1038.0" y="608" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E1065">validators V1–V5 · recall net · second opinion</text><rect x="20" y="629" width="1532" height="24" rx="5" fill="#F1F5F9"/><text x="32" y="646" text-anchor="start" font-size="12" font-weight="800" fill="#334155">4  REDUCE + DRAFT</text><text x="534.0" y="675" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">analyzer_aggregate → facts F-1, F-2</text><text x="366.0" y="713" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">build payload (facts, lists, scratchpad)</text><text x="450.0" y="751" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">draft: narrative + structured claims</text><rect x="20" y="781" width="1532" height="24" rx="5" fill="#F1F5F9"/><text x="32" y="798" text-anchor="start" font-size="12" font-weight="800" fill="#334155">5  VERIFY  (triple check)</text><text x="786.0" y="827" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">claims + facts + evidence only</text><text x="786.0" y="865" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">verdicts: all supported</text><text x="198.0" y="903" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">answer + citations + completeness banner</text><rect x="20" y="933" width="1532" height="24" rx="5" fill="#F1F5F9"/><text x="32" y="950" text-anchor="start" font-size="12" font-weight="800" fill="#334155">6  ACT  (human-in-the-loop)</text><text x="198.0" y="979" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">“comment on the 14 and notify owners”</text><text x="870.0" y="1017" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">propose 15 actions (frozen args, preview)</text><text x="786.0" y="1055" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">approval card</text><text x="786.0" y="1093" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">approve</text><text x="1122.0" y="1131" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">execute once (idempotency keys)</text><text x="534.0" y="1169" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">results + post-condition check</text></svg>