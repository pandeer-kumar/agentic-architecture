<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="860" viewBox="0 0 1760 860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"><defs><marker id="ah-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-4F46E5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah-7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="ah-C026D3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C026D3"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="40" font-size="22" font-weight="800" fill="#0F172A">Payload builder pipeline and storage</text><text x="28" y="62" font-size="13" fill="#475569">How every model request is assembled, recorded and made replayable (custom; no server-side context features)</text><rect x="30" y="280" width="1620" height="250" rx="14" fill="#FDF4FF" fill-opacity="0.55" stroke="#C026D3" stroke-opacity="0.55" stroke-width="1.5"/><text x="44" y="302" font-size="13" font-weight="700" fill="#C026D3" letter-spacing="0.6">SOURCES THE COLLECTORS READ (BLOCK TYPES)</text><rect x="30" y="570" width="1620" height="250" rx="14" fill="#ECFDF5" fill-opacity="0.55" stroke="#059669" stroke-opacity="0.55" stroke-width="1.5"/><text x="44" y="592" font-size="13" font-weight="700" fill="#059669" letter-spacing="0.6">STORAGE WRITTEN BY THE PIPELINE</text><rect x="30" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="112.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">1 Collect</text><text x="112.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">15 block collectors</text><text x="112.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">read stores, not the</text><text x="112.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">previous payload</text><rect x="213" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="295.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">2 Score</text><text x="295.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">priority · recency</text><text x="295.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">relevance to goal</text><text x="295.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">mandatory flags</text><rect x="396" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="478.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">3 Fit budget</text><text x="478.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">per-layer caps</text><text x="478.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">drop / degrade</text><text x="478.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">lowest score first</text><rect x="579" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="661.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">4 Compress</text><text x="661.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">only if still over:</text><text x="661.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">custom summary</text><text x="661.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">of oldest blocks</text><rect x="762" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="844.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">5 Render</text><text x="844.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">XML-tagged sections</text><text x="844.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">untrusted fencing</text><text x="844.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">canonical JSON</text><rect x="945" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="1027.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">6 Order + cache</text><text x="1027.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">stable → volatile</text><text x="1027.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">≤ 4 breakpoints</text><text x="1027.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">deterministic</text><rect x="1128" y="110" width="165" height="120" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/><text x="1210.5" y="152.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2E1065">7 Count</text><text x="1210.5" y="168.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">token meter</text><text x="1210.5" y="183.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">hard limit check</text><text x="1210.5" y="198.5" text-anchor="middle" font-size="11.5" fill="#2E1065" fill-opacity="0.82">fail closed</text><rect x="1311" y="110" width="165" height="120" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/><text x="1393.5" y="152.5" text-anchor="middle" font-