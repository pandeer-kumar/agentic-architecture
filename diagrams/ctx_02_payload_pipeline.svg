books</text><rect x="650" y="320" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="745.0" y="357.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Tool defs</text><text x="745.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">tool router</text><rect x="850" y="320" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="945.0" y="357.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Session state</text><text x="945.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">session_state</text><rect x="1050" y="320" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1145.0" y="357.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Referents</text><text x="1145.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">session_referents</text><rect x="1250" y="320" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1345.0" y="357.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Ledger</text><text x="1345.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">jobs.ledger · job_steps</text><rect x="1450" y="320" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1545.0" y="357.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Scratchpad</text><text x="1545.0" y="372.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">scratchpad_entries</text><rect x="50" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="145.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Retrieved LTM</text><text x="145.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">memory_items</text><rect x="250" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="345.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Handles</text><text x="345.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">result_sets</text><rect x="450" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="545.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Facts</text><text x="545.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">facts</text><rect x="650" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="745.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Samples</text><text x="745.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">records (fenced)</text><rect x="850" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="945.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Epoch turns</text><text x="945.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">session_events (epoch)</text><rect x="1050" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1145.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">Handoff</text><text x="1145.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">epochs.handoff</text><rect x="1250" y="420" width="190" height="80" rx="9" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.6"/><text x="1345.0" y="457.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4A044E">User turn</text><text x="1345.0" y="472.0" text-anchor="middle" font-size="11.5" fill="#4A044E" fill-opacity="0.82">session_events</text><path d="M60,629 a165.0,9 0 0,0 330,0 v132 a165.0,9 0 0,1 -330,0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="225.0" cy="629" rx="165.0" ry="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="225.0" y="683.0" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">session_events</text><text x="225.0" y="699.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">append-only log of every</text><text x="225.0" y="714.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">request, response, tool call</text><text x="225.0" y="729.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">and result (source of truth)</text><path d="M430,629 a165.0,9 0 0,0 330,0 v132 a165.0,9 0 0,1 -330,0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="595.0" cy="629" rx="165.0" ry="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="595.0" y="683.0" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">epochs</text><text x="595.0" y="699.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">one row per model conversation</text><text x="595.0" y="714.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">trigger · handoff JSON</text><text x="595.0" y="729.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">token totals</text><path d="M800,629 a165.0,9 0 0,0 330,0 v132 a165.0,9 0 0,1 -330,0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><ellipse cx="965.0" cy="629" rx="165.0" ry="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="965.0" y="683.0" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">context_snapshots</text><text x="965.0" y="699.0" text-anchor="middle" font-size="11.5" fill="#064E3B" fill-opacity="0.82">manifest: block ids, hashes,</text><text x="965.0" y="7