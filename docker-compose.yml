services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: itsm
      POSTGRES_DB: itsm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      ITSM_DATABASE_URL: postgresql://postgres:itsm@db:5432/itsm
    ports: ["8080:8080"]
volumes:
  pgdata:
