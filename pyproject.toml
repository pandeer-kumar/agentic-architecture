[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itsm-agent"
version = "0.1.0"
description = "Custom-built agentic platform for ITSM: accurate answers over 100-2,000 records, with human-approved writes"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
itsm-agent = "itsm_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itsm_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
